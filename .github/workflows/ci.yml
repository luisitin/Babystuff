name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build index.html
        run: node scripts/build.mjs
      - name: Check index.html is up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::index.html is stale. Run 'node scripts/build.mjs' locally and commit the result."
            exit 1
          fi
      - name: Run tests
        run: node --test
