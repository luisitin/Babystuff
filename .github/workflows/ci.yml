name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Actions use major-version tags so they are easy to update; they can be pinned to commit SHAs for stricter supply-chain safety.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build index.html and artifact.html
        run: node scripts/build.mjs
      - name: Check the built files are up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::index.html is stale. Run 'node scripts/build.mjs' locally and commit the result."
            exit 1
          fi
      - name: Run tests
        run: node --test
